name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint with ruff
        run: ruff check main.py

  # ── 2. Build Docker image ──────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: pdf-signer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Integration smoke-test ──────────────────────────────────────────────
  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create dummy signature image
        run: |
          python3 -c "
          import base64, pathlib
          data = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwADhQGAWjR9awAAAABJRU5ErkJggg=='
          pathlib.Path('signature.png').write_bytes(base64.b64decode(data))
          "

      - name: Create test PDF
        run: |
          pip install reportlab
          python3 -c "
          from reportlab.pdfgen import canvas as c
          cv = c.Canvas('tosign/test_document.pdf')
          cv.drawString(100, 750, 'Test PDF for CI smoke-test')
          cv.save()
          "

      - name: Run docker compose
        run: docker compose up --build --abort-on-container-exit

      - name: Verify signed output
        run: |
          ls -lh signed/
          test -f signed/test_document.pdf \
            && echo "✓ signed/test_document.pdf produced" \
            || (echo "✗ Output missing" && exit 1)

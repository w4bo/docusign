name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  buid:
    name: Docker Integration
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - uses: actions/checkout@v4

      - name: Create dummy signature
        run: |
          cp config.example.yaml config.yaml

      - name: Create dummy signature
        run: |
          # 1×1 white PNG as placeholder signature for CI
          python3 -c "
          import base64, pathlib
          # minimal 1x1 white PNG
          data = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwADhQGAWjR9awAAAABJRU5ErkJggg=='
          pathlib.Path('signature.png').write_bytes(base64.b64decode(data))
          "

      - name: Create a test PDF
        run: |
          pip install reportlab
          python3 - << 'EOF'
          from reportlab.pdfgen import canvas
          c = canvas.Canvas("tosign/test_document.pdf")
          c.drawString(100, 750, "Test PDF for CI smoke-test")
          c.save()
          EOF

      - name: Run docker compose
        run: docker compose up --build --abort-on-container-exit

      - name: Verify output
        run: |
          ls -lh signed/
          test -f signed/test_document.pdf && echo "✓ Signed PDF produced" || (echo "✗ Output missing" && exit 1)
